<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thêm Vị Thế</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #5288c1);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: var(--secondary-bg-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--hint-color);
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--hint-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: var(--button-color);
            box-shadow: 0 0 0 2px rgba(82, 136, 193, 0.2);
        }
        
        .error {
            color: #ff3b30;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📈 Thêm Vị Thế Mới</h2>
        
        <div class="form-group">
            <label for="symbol">Mã cổ phiếu (VD: PVS)</label>
            <input type="text" id="symbol" placeholder="Nhập mã..." style="text-transform:uppercase" required>
            <div class="error" id="error-symbol">Vui lòng nhập mã hợp lệ.</div>
        </div>

        <div class="form-group">
            <label for="qty">Số lượng</label>
            <input type="number" id="qty" placeholder="VD: 1000" min="1" required>
            <div class="error" id="error-qty">Vui lòng nhập số lượng > 0.</div>
        </div>

        <div class="form-group">
            <label for="entry">Giá mua</label>
            <input type="number" id="entry" placeholder="VD: 35.5" step="0.01" min="0" required>
            <div class="error" id="error-entry">Vui lòng nhập giá mua hợp lệ.</div>
        </div>

        <div class="form-group">
            <label for="date">Ngày mua (Tùy chọn)</label>
            <input type="date" id="date">
        </div>

        <div class="form-group">
            <label for="note">Ghi chú (Tùy chọn)</label>
            <input type="text" id="note" placeholder="VD: Mua test sóng...">
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('date').value = now.toISOString().slice(0,10);

        tg.MainButton.setText("LƯU THÔNG TIN");
        tg.MainButton.show();

        tg.MainButton.onClick(function() {
            let symbol = document.getElementById('symbol').value.trim().toUpperCase();
            let qty = parseInt(document.getElementById('qty').value);
            let entry = parseFloat(document.getElementById('entry').value);
            let date = document.getElementById('date').value;
            let note = document.getElementById('note').value.trim();

            let hasError = false;
            
            if(!symbol || symbol.length > 10) {
                document.getElementById('error-symbol').style.display = 'block';
                hasError = true;
            } else { document.getElementById('error-symbol').style.display = 'none'; }
            
            if(isNaN(qty) || qty <= 0) {
                document.getElementById('error-qty').style.display = 'block';
                hasError = true;
            } else { document.getElementById('error-qty').style.display = 'none'; }
            
            if(isNaN(entry) || entry <= 0) {
                document.getElementById('error-entry').style.display = 'block';
                hasError = true;
            } else { document.getElementById('error-entry').style.display = 'none'; }

            if(hasError) {
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            let data = {
                symbol: symbol,
                qty: qty,
                entry: entry,
                date: date,
                note: note,
                initData: tg.initData
            };

            tg.MainButton.showProgress();

            fetch('/api/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                tg.MainButton.hideProgress();
                if(result.status === 'ok') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.close();
                } else {
                    tg.showAlert("Lỗi: " + result.message);
                }
            })
            .catch(error => {
                tg.MainButton.hideProgress();
                tg.showAlert("Lỗi kết nối. Vui lòng thử lại.");
            });
        });
    </script>
</body>
</html>
